name: Ejecución Automática de Pruebas de API

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test_suite:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://jsonplaceholder.typicode.com
      TIMEOUT: "10"

    steps:
    - name: Clonar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar pruebas y generar reporte HTML
      run: |
        pytest tests/ --html=reporte_ci.html --self-contained-html

    - name: Guardar el reporte HTML como artefacto descargable
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reporte-pruebas-api
        path: reporte_ci.html